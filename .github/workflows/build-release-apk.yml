name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch, tag, or SHA to build (leave empty for current ref)'
        required: false
        default: ''
        type: string
      version_name:
        description: 'Version name override (e.g., 1.0.0)'
        required: false
        default: ''
        type: string
      version_code:
        description: 'Version code override (e.g., 1)'
        required: false
        default: ''
        type: string
      release_title:
        description: 'GitHub Release title (leave empty to skip creating a release)'
        required: false
        default: ''
        type: string
      release_notes:
        description: 'Release notes / changelog (markdown)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.keystore"

      - name: Build Release APK
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          GRADLE_ARGS=""
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            GRADLE_ARGS="$GRADLE_ARGS -PversionName=${{ github.event.inputs.version_name }}"
          fi
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            GRADLE_ARGS="$GRADLE_ARGS -PversionCode=${{ github.event.inputs.version_code }}"
          fi
          ./gradlew assembleRelease --no-daemon $GRADLE_ARGS

      - name: Clean up keystore
        if: always()
        run: |
          rm -f "${{ runner.temp }}/release.keystore"

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: curfew-apks
          path: android/app/build/outputs/apk/release/curfew_V*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event.inputs.release_title != ''
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.release_title }}
          tag_name: ${{ github.event.inputs.version_name != '' && (startsWith(github.event.inputs.version_name, 'v') && github.event.inputs.version_name || format('v{0}', github.event.inputs.version_name)) || 'v1.0.0' }}
          body: ${{ github.event.inputs.release_notes }}
          files: android/app/build/outputs/apk/release/curfew_V*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
